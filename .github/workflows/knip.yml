name: Knip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  knip:
    name: Dead-code gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      # v1.4.42 — exports + types tiers promoted to enforcing. The
      # `knip.jsonc` ignore-block carries the shadcn UI surface and the
      # `src/lib/validations/**` contract types; everything else has
      # to clear or get justified there.
      #
      # This pass cannot see a module whose only importer is its own test —
      # vitest is a knip plugin, so test files are entries. The header of
      # `knip.jsonc` demonstrates that and names the pass that does see it.
      - run: pnpm knip --reporter compact
