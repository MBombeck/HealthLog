name: Edge image

# Every push to `main` publishes `:edge` and `:edge-<sha>` (amd64 only).
# `main` is the fix line between the Saturday releases
# (docs/contributing/release-policy.md), and `:edge` is how a fix can be
# checked before it is released. It is not a release: no `:latest`, no
# semver tags, no signature, no promotion. Release images come from
# docker-publish.yml on a `v*` tag.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A newer push supersedes a build still running for an older one.
concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  edge:
    name: Build and push :edge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR rejects uppercase repository refs; see docker-publish.yml.
      - name: Lowercase image ref
        run: |
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same two paths as the release build: with the licence key the
      # offline GeoLite2 tier is baked in, without it the image ships the
      # `.empty` marker and the runtime falls back.
      - name: Fetch GeoLite2 databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "::warning::MAXMIND_LICENSE_KEY secret is unset. The edge image ships without the offline GeoLite2 databases."
            mkdir -p assets/geolite2
            touch assets/geolite2/.empty
            exit 0
          fi
          ./scripts/fetch-geolite2.sh

      # The version reads as the release it builds on plus `-edge.<sha>`,
      # so /api/version tells an edge build from a release, and a client
      # that compares version numbers still sees the release line.
      - name: Resolve build provenance
        id: provenance
        run: |
          package_version="$(node -p "require('./package.json').version")"
          {
            echo "version=v${package_version}-edge.${GITHUB_SHA::12}"
            echo "build_sha=${GITHUB_SHA::12}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Writes the `-main` cache scope the release build warm-starts from.
      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:edge
            ${{ env.IMAGE_REF }}:edge-${{ steps.provenance.outputs.build_sha }}
          labels: |
            org.opencontainers.image.title=HealthLog (edge)
            org.opencontainers.image.description=Unreleased build of main, for checking fixes
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.provenance.outputs.version }}
            NEXT_PUBLIC_APP_BUILD_SHA=${{ steps.provenance.outputs.build_sha }}
            NEXT_PUBLIC_APP_BUILT_AT=${{ steps.provenance.outputs.built_at }}
            OS_PACKAGES_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=build-amd64-main
          cache-to: type=gha,mode=max,scope=build-amd64-main
          provenance: true
          sbom: true
