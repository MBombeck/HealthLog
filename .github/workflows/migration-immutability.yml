name: Migration immutability

# A migration that is merged into `main` or a `release/vX.Y.0` branch is
# never changed again: only new files may appear under prisma/migrations/.
# An `:edge` host has applied every migration on `main`, a `:nightly` host
# every one on the release branch, and Prisma refuses to start against a
# migration whose checksum changed since it ran
# (docs/contributing/release-policy.md, "Migrations").
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: migration-immutability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Merged migrations stay unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request is checked against its base. A push is checked against
      # the commit the branch stood at before; a new branch, or a `before`
      # the clone does not have, falls back to main.
      - name: Refuse edits to merged migrations
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            head="$GITHUB_SHA"
            base="$BEFORE"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="origin/main"
            fi
          fi
          echo "Checking ${base}...${head}"
          node scripts/release-policy.mjs migrations --base "$base" --head "$head"
