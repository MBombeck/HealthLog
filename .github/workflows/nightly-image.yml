name: Nightly image

# Every night the newest open `release/vX.Y.0` branch, the next minor, is
# built for amd64 and arm64 and published as `:nightly` and
# `:nightly-YYYYMMDD-<sha>`. It is not a release: never the latest tag, no
# semver tag, no GitHub release, no promotion. It may break and is not meant for
# production (docs/self-hosting/channels.md). The image reports the channel
# `nightly` on /api/version. Release images come from docker-publish.yml on
# a `v*` tag, `:edge` from edge-image.yml on every push to `main`.
#
# A night on which the branch head has not moved since the last nightly
# builds nothing: the `:nightly` index carries the commit it was built from
# as an annotation, and the resolve job compares against it.
on:
  schedule:
    # 02:37 UTC, off the hour when scheduled runs queue up.
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the branch head is the one the last nightly was built from
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One nightly at a time; a manual run waits for a scheduled one.
concurrency:
  group: nightly-image
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the next minor's branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.branch.outputs.build }}
      branch: ${{ steps.branch.outputs.branch }}
      sha: ${{ steps.branch.outputs.sha }}
      short_sha: ${{ steps.branch.outputs.short_sha }}
      package_version: ${{ steps.branch.outputs.package_version }}
      version: ${{ steps.branch.outputs.version }}
      date_tag: ${{ steps.branch.outputs.date_tag }}
    steps:
      - name: Lowercase image ref
        run: |
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The newest `release/vX.Y.0` by version, and only when it is ahead
      # of the newest release tag: a release branch that was merged but
      # not yet deleted is not the next minor.
      - name: Pick the branch and compare with the last nightly
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          picked="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/release/v" \
              --jq '.[] | "\(.ref | ltrimstr("refs/heads/")) \(.object.sha)"' |
              grep -E '^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0 [0-9a-f]{40}$' |
              sort -V | tail -n 1 || true
          )"
          if [ -z "$picked" ]; then
            echo "::notice::No release/vX.Y.0 branch is open. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="${picked% *}"
          sha="${picked#* }"
          minor="${branch#release/}"

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | ltrimstr("refs/tags/")' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V | tail -n 1 || true
          )"
          if [ -n "$latest_tag" ] && [ "$(printf '%s\n%s\n' "$latest_tag" "$minor" | sort -V | tail -n 1)" = "$latest_tag" ]; then
            echo "::notice::$branch is not ahead of the latest release $latest_tag. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(
            docker buildx imagetools inspect --raw "${IMAGE_REF}:nightly" 2>/dev/null |
              jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true
          )"
          if [ "$previous" = "$sha" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$branch is still at ${sha::12}, the commit of the last nightly. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_version="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${sha}" \
              -H "Accept: application/vnd.github.raw+json" | jq -r .version
          )"
          date_tag="$(date -u +%Y%m%d)"
          {
            echo "build=true"
            echo "branch=$branch"
            echo "sha=$sha"
            echo "short_sha=${sha::12}"
            echo "package_version=$package_version"
            echo "version=${minor}-nightly.${date_tag}.${sha::12}"
            echo "date_tag=$date_tag"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building $branch at ${sha::12} (last nightly: ${previous:-none})."

  # One native runner per architecture, pushed by digest and stitched in
  # `merge`, the same way docker-publish.yml builds a release.
  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache_scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: arm64
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase image ref
        run: |
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same two paths as the release build: with the licence key the
      # offline GeoLite2 tier is baked in, without it the image ships the
      # `.empty` marker and the runtime falls back.
      - name: Fetch GeoLite2 databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "::warning::MAXMIND_LICENSE_KEY secret is unset. The nightly image ships without the offline GeoLite2 databases."
            mkdir -p assets/geolite2
            touch assets/geolite2/.empty
            exit 0
          fi
          ./scripts/fetch-geolite2.sh

      - name: Resolve build time
        id: provenance
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_APP_CHANNEL is what /api/version reports as `channel`.
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=HealthLog (nightly)
            org.opencontainers.image.description=Nightly build of the next minor, not for production
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve.outputs.version }}
            NEXT_PUBLIC_APP_BUILD_SHA=${{ needs.resolve.outputs.short_sha }}
            NEXT_PUBLIC_APP_BUILT_AT=${{ steps.provenance.outputs.built_at }}
            NEXT_PUBLIC_APP_CHANNEL=nightly
            OS_PACKAGES_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: |
            type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=build-${{ matrix.cache_scope }}-nightly
            type=gha,scope=build-${{ matrix.cache_scope }}-main
          cache-to: type=gha,mode=max,scope=build-${{ matrix.cache_scope }}-nightly
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-digest-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, tag and sign
    needs: [resolve, build]
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Keyless cosign signature, as for a release (docker-publish.yml).
      id-token: write
    outputs:
      image_ref: ${{ steps.published.outputs.image_ref }}
      image_tag: ${{ steps.published.outputs.image_tag }}
      image_digest: ${{ steps.published.outputs.image_digest }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: nightly-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase image ref
        run: |
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The revision annotation on the index is what the next night's
      # resolve job reads to decide whether there is anything new.
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DATED_TAG: nightly-${{ needs.resolve.outputs.date_tag }}-${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE_REF}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::Expected two platform digests, found ${#sources[@]}." >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE_REF}:nightly" \
            -t "${IMAGE_REF}:${DATED_TAG}" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "${sources[@]}"
          echo "DATED_TAG=${DATED_TAG}" >> "$GITHUB_ENV"

      - name: Resolve published image
        id: published
        run: |
          set -euo pipefail
          image_digest="$(docker buildx imagetools inspect "${IMAGE_REF}:${DATED_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a manifest digest for ${IMAGE_REF}:${DATED_TAG}." >&2
            exit 1
          fi
          nightly_digest="$(docker buildx imagetools inspect "${IMAGE_REF}:nightly" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$nightly_digest" != "$image_digest" ]; then
            echo "::error::${IMAGE_REF}:nightly resolves to ${nightly_digest}, ${DATED_TAG} to ${image_digest}." >&2
            exit 1
          fi
          {
            echo "image_ref=$IMAGE_REF"
            echo "image_tag=$DATED_TAG"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign multi-arch manifest (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.published.outputs.image_digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
          echo "::notice::Nightly index signed (keyless): ${IMAGE_REF}@${IMAGE_DIGEST}"

  # Pull the exact digest, migrate a fresh database, start it, and check
  # /api/version (version, commit and channel) and /api/health.
  verify:
    name: Verify the nightly image
    needs: [resolve, merge]
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.merge.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/post-publish-verify.yml
    with:
      image_ref: ${{ needs.merge.outputs.image_ref }}
      image_tag: ${{ needs.merge.outputs.image_tag }}
      image_digest: ${{ needs.merge.outputs.image_digest }}
      build_sha: ${{ needs.resolve.outputs.short_sha }}
      expected_version: ${{ needs.resolve.outputs.package_version }}
      expected_channel: nightly
