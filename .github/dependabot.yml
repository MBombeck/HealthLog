version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    # Only security patches — ignore all version updates
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Ignore non-security minor/major bumps
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"
