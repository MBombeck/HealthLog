# Copyright and licence of every file in this repository, in the format of
# the REUSE specification 3.3 (https://reuse.software/spec-3.3/). The full
# licence texts are in LICENSES/; `reuse lint` in CI checks that every file
# is covered. When a later annotation matches a file, it wins over an
# earlier one, so the general rule comes first and the third-party files
# after it. A file added from another project gets its own annotation here,
# and its licence a text in LICENSES/ (`reuse download <SPDX id>`).
version = 1
SPDX-PackageName = "HealthLog"
SPDX-PackageSupplier = "the HealthLog maintainers"
SPDX-PackageDownloadLocation = "https://github.com/MBombeck/HealthLog"

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 the HealthLog maintainers"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# Inter, the interface typeface, self-hosted.
[[annotations]]
path = "src/app/fonts/inter/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"

# The doctor-report PDF fonts, subset from Noto Sans and Source.
[[annotations]]
path = "src/lib/doctor-report-pdf/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2022 The Noto Project Authors <https://github.com/notofonts/latin-greek-cyrillic>",
  "2022 The Noto Project Authors <https://github.com/notofonts/math>",
  "2014-2021 Adobe <http://www.adobe.com/>",
]
SPDX-License-Identifier = "OFL-1.1"

# A patch against a file of @stryker-mutator/vitest-runner (Apache-2.0).
[[annotations]]
path = "patches/@stryker-mutator__vitest-runner@*.patch"
precedence = "override"
SPDX-FileCopyrightText = [
  "Stryker contributors <https://github.com/stryker-mutator/stryker-js>",
  "2026 the HealthLog maintainers",
]
SPDX-License-Identifier = "Apache-2.0"
