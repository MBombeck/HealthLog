    - weight
    - pulse
    - mood
    - compliance
    - hrv
    - sleep
    - resting_hr
    - steps
    - active_energy
    - flights
    - distance
    - vo2_max
    - body_temp
  tone:
    - good
    - watch
    - info
  topic:
    - blood_pressure
    - pulse
    - weight
    - mood
    - medication
    - sleep
    - activity
  category:
